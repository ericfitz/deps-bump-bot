name: Renovate

# Self-hosted Renovate for every ericfitz repo that has the ericfitz-deps-bot App
# installed AND a renovate.json (requireConfig=required). Shared rules live in
# ../../default.json; runner settings in ../../renovate-global.json.

on:
  schedule:
    - cron: '0 13 * * *'   # daily: alert-driven fixes open within a day; routine updates are gated by the preset's Monday schedule
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Comma-separated repos to process (e.g. ericfitz/tmi); empty = all discovered'
        type: string
        default: ''
      dryRun:
        description: 'Dry run mode'
        type: choice
        options: [none, lookup, full]
        default: none
      logLevel:
        description: 'Renovate log level'
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (for the global config file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint ericfitz-deps-bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve dispatch inputs
        id: opts
        env:
          REPOS: ${{ inputs.repositories }}
          DRY: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          if [ -n "${REPOS:-}" ]; then
            filter="$(printf '%s' "$REPOS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | jq -R . | jq -cs 'map(select(length > 0))')"
            echo "filter=$filter" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${DRY:-}" ] && [ "$DRY" != "none" ]; then
            echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          configurationFile: renovate-global.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.132.5
        env:
          RENOVATE_AUTODISCOVER_FILTER: ${{ steps.opts.outputs.filter }}
          RENOVATE_DRY_RUN: ${{ steps.opts.outputs.dry }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
